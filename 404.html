<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Bhavik Nagre</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230F0F11'/%3E%3Ctext x='50' y='66' font-size='46' font-family='Arial, sans-serif' font-weight='700' fill='%2310B981' text-anchor='middle'%3EBN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="style.css">
<style>
  .not-found {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .not-found-code {
    font-family: var(--font-mono);
    font-size: clamp(4rem, 16vw, 9rem);
    font-weight: 800;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 60px rgba(16, 185, 129, 0.35);
  }
  .not-found-msg {
    color: var(--text-secondary);
    font-size: 1.05rem;
    margin: 16px 0 32px;
    max-width: 460px;
  }
</style>
</head>
<body>
  <div class="not-found">
    <div class="hero-glow"></div>
    <p class="not-found-code">404</p>
    <p class="not-found-msg">This page doesn't exist — but the rest of the portfolio does. Let's get you back.</p>
    <a href="/portfolio/" class="btn btn-primary">
      <i data-lucide="arrow-left"></i> Back to Home
    </a>
  </div>

<script src="https://unpkg.com/lucide@1.25.0/dist/umd/lucide.js"></script>
<script>lucide.createIcons();</script>
</body>
